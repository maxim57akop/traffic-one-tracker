map $http_x_forwarded_proto $trafficone_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $trafficone_forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

map $http_cf_connecting_ip $trafficone_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 128m;

    location ~ ^/(api|postback|lead|ftd|r|lander|up|health)(/|$) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $trafficone_forwarded_host;
        proxy_set_header X-Forwarded-Host $trafficone_forwarded_host;
        proxy_set_header X-Real-IP $trafficone_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trafficone_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location = / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $trafficone_forwarded_host;
        proxy_set_header X-Forwarded-Host $trafficone_forwarded_host;
        proxy_set_header X-Real-IP $trafficone_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trafficone_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location ~ ^/(?!api(?:/|$)|postback(?:/|$)|lead(?:/|$)|ftd(?:/|$)|r(?:/|$)|lander(?:/|$)|up$|health$|_next(?:/|$)|login(?:/|$)|dashboard(?:/|$)|campaigns(?:/|$)|campaign(?:/|$)|landing-pages(?:/|$)|offers(?:/|$)|traffic-sources(?:/|$)|reports(?:/|$)|domains(?:/|$)|users(?:/|$)|settings(?:/|$)|maintenance(?:/|$)|integrations(?:/|$)|postbacks(?:/|$)|profile(?:/|$)|affiliate-networks(?:/|$)|flows(?:/|$)|streams(?:/|$)|trends(?:/|$)|icon\.jpg$|logo\.jpg$|favicon\.ico$)[^/]+$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $trafficone_forwarded_host;
        proxy_set_header X-Forwarded-Host $trafficone_forwarded_host;
        proxy_set_header X-Real-IP $trafficone_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trafficone_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $trafficone_forwarded_host;
        proxy_set_header X-Forwarded-Host $trafficone_forwarded_host;
        proxy_set_header X-Real-IP $trafficone_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trafficone_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}

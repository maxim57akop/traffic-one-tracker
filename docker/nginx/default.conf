map $http_x_forwarded_proto $trafficone_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $trafficone_forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

map $http_cf_connecting_ip $trafficone_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $request_uri $trafficone_offer_separator {
    default "?";
    "~\\?"   "&";
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 128m;

    location ~ ^/lander/([^/]+)/(.+\.php)$ {
        set $trafficone_lander_base /lander/$1/;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/lander/$1/$2;
        fastcgi_param DOCUMENT_ROOT /app/lander;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_param TRAFFICONE_LANDER_BASE $trafficone_lander_base;
        fastcgi_param TRAFFICONE_OFFER_URL "$request_uri${trafficone_offer_separator}lp=1";
        fastcgi_param PHP_VALUE "auto_prepend_file=/app/php/landing-bootstrap.php";
    }

    location ~ ^/__lander/([^/]+)/(.+\.php)$ {
        internal;
        set $trafficone_lander_base /lander/$1/;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/lander/$1/$2;
        fastcgi_param DOCUMENT_ROOT /app/lander;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_param TRAFFICONE_LANDER_BASE $trafficone_lander_base;
        fastcgi_param TRAFFICONE_OFFER_URL "$request_uri${trafficone_offer_separator}lp=1";
        fastcgi_param PHP_VALUE "auto_prepend_file=/app/php/landing-bootstrap.php";
    }

    location ~ ^/__lander/([^/]+)/(.+)$ {
        internal;
        set $trafficone_lander_base /lander/$1/;
        alias /app/lander/$1/$2;
        sub_filter_once off;
        sub_filter_types text/plain application/javascript text/javascript text/css;
        sub_filter "<head>" "<head><base href=\"$trafficone_lander_base\">";
        sub_filter "{{offer}}" "$request_uri${trafficone_offer_separator}lp=1";
        sub_filter "{offer}" "$request_uri${trafficone_offer_separator}lp=1";
    }

    location ~ ^/preview/lander/([^/]+)/(.+\.php)$ {
        auth_request /__admin_access_check;
        set $trafficone_lander_base /preview/lander/$1/;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/lander/$1/$2;
        fastcgi_param DOCUMENT_ROOT /app/lander;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SCRIPT_NAME /$1/$2;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_param TRAFFICONE_LANDER_BASE $trafficone_lander_base;
        fastcgi_param TRAFFICONE_OFFER_URL "#";
        fastcgi_param PHP_VALUE "auto_prepend_file=/app/php/landing-bootstrap.php";
    }

    location ~ ^/preview/lander/([^/]+)/(.+)$ {
        auth_request /__admin_access_check;
        set $trafficone_lander_base /preview/lander/$1/;
        alias /app/lander/$1/$2;
        sub_filter_once off;
        sub_filter_types text/plain application/javascript text/javascript text/css;
        sub_filter "<head>" "<head><base href=\"$trafficone_lander_base\">";
        sub_filter "{{offer}}" "#";
        sub_filter "{offer}" "#";
    }

    location ~ ^/lander/([^/]+)/?$ {
        set $lander_folder $1;
        set $trafficone_lander_base /lander/$lander_folder/;
        error_page 418 = /lander/$lander_folder/index.php;
        root /app;
        if (-f /app/lander/$lander_folder/index.php) {
            return 418;
        }
        try_files /lander/$lander_folder/index.html =404;
        sub_filter_once off;
        sub_filter_types text/plain application/javascript text/javascript text/css;
        sub_filter "<head>" "<head><base href=\"$trafficone_lander_base\">";
        sub_filter "{{offer}}" "$request_uri${trafficone_offer_separator}lp=1";
        sub_filter "{offer}" "$request_uri${trafficone_offer_separator}lp=1";
    }

    location ~ ^/lander/([^/]+)/(.+)$ {
        set $trafficone_lander_base /lander/$1/;
        alias /app/lander/$1/$2;
        sub_filter_once off;
        sub_filter_types text/plain application/javascript text/javascript text/css;
        sub_filter "<head>" "<head><base href=\"$trafficone_lander_base\">";
        sub_filter "{{offer}}" "$request_uri${trafficone_offer_separator}lp=1";
        sub_filter "{offer}" "$request_uri${trafficone_offer_separator}lp=1";
    }

    location /lander/ {
        return 404;
    }

    location ~ ^/(api|postback|lead|ftd|offer|r|up|health)(/|$) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $trafficone_forwarded_host;
        proxy_set_header X-Forwarded-Host $trafficone_forwarded_host;
        proxy_set_header X-Real-IP $trafficone_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trafficone_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location = /__admin_access_check {
        internal;
        proxy_pass http://backend:8080/api/admin-access-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $trafficone_forwarded_host;
        proxy_set_header X-Forwarded-Host $trafficone_forwarded_host;
        proxy_set_header X-Real-IP $trafficone_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trafficone_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location = / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $trafficone_forwarded_host;
        proxy_set_header X-Forwarded-Host $trafficone_forwarded_host;
        proxy_set_header X-Real-IP $trafficone_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trafficone_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location = /preview {
        auth_request /__admin_access_check;
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $trafficone_forwarded_host;
        proxy_set_header X-Forwarded-Host $trafficone_forwarded_host;
        proxy_set_header X-Real-IP $trafficone_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trafficone_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location ~ ^/(login|dashboard|campaigns|campaign|landing-pages|offers|traffic-sources|reports|domains|users|settings|maintenance|integrations|postbacks|profile|preview|affiliate-networks|flows|streams|trends)(/|$) {
        auth_request /__admin_access_check;
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $trafficone_forwarded_host;
        proxy_set_header X-Forwarded-Host $trafficone_forwarded_host;
        proxy_set_header X-Real-IP $trafficone_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trafficone_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location ~ ^/(?!api(?:/|$)|postback(?:/|$)|lead(?:/|$)|ftd(?:/|$)|offer(?:/|$)|r(?:/|$)|lander(?:/|$)|up$|health$|_next(?:/|$)|login(?:/|$)|dashboard(?:/|$)|campaigns(?:/|$)|campaign(?:/|$)|landing-pages(?:/|$)|offers(?:/|$)|traffic-sources(?:/|$)|reports(?:/|$)|domains(?:/|$)|users(?:/|$)|settings(?:/|$)|maintenance(?:/|$)|integrations(?:/|$)|postbacks(?:/|$)|profile(?:/|$)|preview(?:/|$)|affiliate-networks(?:/|$)|flows(?:/|$)|streams(?:/|$)|trends(?:/|$)|icon\.jpg$|logo\.jpg$|favicon\.ico$)[^/]+$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $trafficone_forwarded_host;
        proxy_set_header X-Forwarded-Host $trafficone_forwarded_host;
        proxy_set_header X-Real-IP $trafficone_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trafficone_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $trafficone_forwarded_host;
        proxy_set_header X-Forwarded-Host $trafficone_forwarded_host;
        proxy_set_header X-Real-IP $trafficone_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trafficone_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}
